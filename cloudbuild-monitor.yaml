steps:
  - name: gcr.io/cloud-builders/docker
    id: build-monitor
    args:
      - build
      - -f
      - Dockerfile.monitor
      - -t
      - europe-west4-docker.pkg.dev/invoice-mlops/invoice-mlops/monitor:$_TAG
      - .

images:
  - europe-west4-docker.pkg.dev/invoice-mlops/invoice-mlops/monitor:$_TAG
substitutions:
  _TAG: week11
options:
  logging: CLOUD_LOGGING_ONLY
