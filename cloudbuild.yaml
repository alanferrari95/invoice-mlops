steps:
  - name: python:3.12-slim
    entrypoint: bash
    args:
      - -c
      - pip install -r requirements.txt pytest && PYTHONPATH=. pytest tests/test_score_schema.py tests/test_score_validation.py -q
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - europe-west4-docker.pkg.dev/invoice-mlops/invoice-mlops/api:$SHORT_SHA
      - .
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - europe-west4-docker.pkg.dev/invoice-mlops/invoice-mlops/api:$SHORT_SHA
  - name: gcr.io/cloud-builders/gcloud
    args:
      - run
      - deploy
      - invoice-mlops-api
      - --image=europe-west4-docker.pkg.dev/invoice-mlops/invoice-mlops/api:$SHORT_SHA
      - --region=europe-west4
      - --service-account=invoice-mlops-work@invoice-mlops.iam.gserviceaccount.com
      - --set-secrets=MODEL_URI=MODEL_URI:latest
      - --min-instances=0
      - --port=8080
      - --allow-unauthenticated
images:
  - europe-west4-docker.pkg.dev/invoice-mlops/invoice-mlops/api:$SHORT_SHA
options:
  logging: CLOUD_LOGGING_ONLY