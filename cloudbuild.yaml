# Merge to main: test -> build/push images -> deploy a 20% canary -> publish the
# pipeline templates and gold sets -> submit the staging pipeline run.
# Everything is derived from $PROJECT_ID, so the same file works in any project.
substitutions:
  _REGION: europe-west4
  _REPO: ${_REGION}-docker.pkg.dev/${PROJECT_ID}/invoice-mlops
  _REGISTRY_MODEL: projects/${PROJECT_ID}/locations/${_REGION}/models/risk-classifier
  _EXTRACTOR_MODEL: projects/${PROJECT_ID}/locations/${_REGION}/models/invoice-extractor
  _TEMPLATES: gs://${PROJECT_ID}-artifacts/pipelines
  _WORK_SA: invoice-mlops-work@${PROJECT_ID}.iam.gserviceaccount.com

steps:
  - name: python:3.12-slim
    id: test-and-compile
    entrypoint: bash
    env:
      - PIPELINE_IMAGE=${_REPO}/train:$SHORT_SHA
      - GOOGLE_CLOUD_PROJECT=$PROJECT_ID
      - REGION=${_REGION}
    args:
      - -c
      - |
        set -euo pipefail
        pip install -r requirements-dev.txt
        PYTHONPATH=. pytest -q
        PYTHONPATH=. python pipelines/risk_train_pipeline.py
        PYTHONPATH=. python pipelines/extract_eval_pipeline.py

  - name: gcr.io/cloud-builders/docker
    id: build-train
    waitFor: [test-and-compile]
    args: [build, -f, Dockerfile.train, -t, "${_REPO}/train:$SHORT_SHA", -t, "${_REPO}/train:latest", .]

  - name: gcr.io/cloud-builders/docker
    id: build-api
    waitFor: [test-and-compile]
    args: [build, -t, "${_REPO}/api:$SHORT_SHA", .]

  - name: gcr.io/cloud-builders/docker
    id: build-monitor
    waitFor: [test-and-compile]
    args: [build, -f, Dockerfile.monitor, -t, "${_REPO}/monitor:$SHORT_SHA", -t, "${_REPO}/monitor:latest", .]

  - name: gcr.io/cloud-builders/docker
    id: push
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        for image in train monitor; do
          docker push ${_REPO}/$$image:$SHORT_SHA
          docker push ${_REPO}/$$image:latest
        done
        docker push ${_REPO}/api:$SHORT_SHA

  # The revision is pinned to the risk-model version and the extractor (prompt) version that
  # hold the `production` alias right now. A project without them yet (fresh bootstrap) skips
  # the deploy instead of failing: run the two pipelines once, then the next merge deploys.
  - name: gcr.io/cloud-builders/gcloud
    id: deploy-api
    entrypoint: bash
    env:
      - PROJECT=$PROJECT_ID
      - REGION=${_REGION}
    args:
      - -c
      - |
        set -euo pipefail
        if ! VERSION=$(bash scripts/registry_version.sh production) \
           || ! EXTRACTOR_VERSION=$(MODEL_ID=invoice-extractor bash scripts/registry_version.sh production); then
          echo "No production model or extractor in the Registry yet: skipping deploy."
          echo "Bootstrap: python -m src.launcher --trigger manual; python pipelines/submit_extract_eval.py --prompt-version v2"
          exit 0
        fi
        echo "risk model v$$VERSION, extractor v$$EXTRACTOR_VERSION"
        gcloud run deploy invoice-mlops-api \
          --image=${_REPO}/api:$SHORT_SHA \
          --region=${_REGION} \
          --service-account=${_WORK_SA} \
          --clear-secrets \
          --update-env-vars=REGISTRY_MODEL=${_REGISTRY_MODEL},MODEL_VERSION_ID=$$VERSION,EXTRACTOR_REGISTRY_MODEL=${_EXTRACTOR_MODEL},EXTRACTOR_VERSION_ID=$$EXTRACTOR_VERSION \
          --min-instances=0 \
          --port=8080 \
          --no-traffic \
          --tag=sha-$SHORT_SHA
        touch /workspace/.deployed

  # The new revision starts at 0%; this moves it to a 20% canary next to the stable one.
  # Promote with scripts/promote.sh, roll back with scripts/rollback.sh (no rebuild).
  - name: gcr.io/cloud-builders/gcloud
    id: canary-20
    entrypoint: bash
    env:
      - PROJECT=$PROJECT_ID
      - REGION=${_REGION}
    args:
      - -c
      - |
        if [ -f /workspace/.deployed ]; then bash scripts/canary.sh; else echo "nothing deployed"; fi

  # Versioned gold sets and pipeline templates, so scheduled and drift-triggered runs use
  # exactly what was merged.
  - name: gcr.io/cloud-builders/gcloud
    id: publish-template
    waitFor: [push]
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        gcloud storage cp data/gold/risk_gold.csv gs://${PROJECT_ID}-raw/gold/risk_gold.csv
        gcloud storage rsync --recursive --delete-unmatched-destination-objects \
          data/gold/extract gs://${PROJECT_ID}-raw/gold/extract
        gcloud storage cp pipelines/risk_train_eval.yaml ${_TEMPLATES}/risk_train_eval-$SHORT_SHA.yaml
        gcloud storage cp pipelines/risk_train_eval.yaml ${_TEMPLATES}/risk_train_eval.yaml
        gcloud storage cp pipelines/extract_eval.yaml ${_TEMPLATES}/extract_eval.yaml

  # Cloud Run Jobs resolve the image digest when they are updated, not on every execution.
  - name: gcr.io/cloud-builders/gcloud
    id: update-jobs
    waitFor: [push]
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        for job in drift-check risk-pipeline-launcher; do
          if gcloud run jobs describe $$job --region=${_REGION} >/dev/null 2>&1; then
            gcloud run jobs update $$job --region=${_REGION} --image=${_REPO}/monitor:$SHORT_SHA
          else
            echo "job $$job not created yet (infra/), skipping"
          fi
        done

  - name: python:3.12-slim
    id: submit-staging-pipeline
    waitFor: [publish-template]
    entrypoint: bash
    env:
      - SHORT_SHA=$SHORT_SHA
      - GOOGLE_CLOUD_PROJECT=$PROJECT_ID
      - REGION=${_REGION}
    args:
      - -c
      - |
        set -euo pipefail
        pip install "google-cloud-aiplatform[pipelines]==2.6.0"
        python pipelines/submit_staging.py

images:
  - ${_REPO}/api:$SHORT_SHA
  - ${_REPO}/train:$SHORT_SHA
  - ${_REPO}/monitor:$SHORT_SHA
options:
  logging: CLOUD_LOGGING_ONLY
  dynamicSubstitutions: true
