# Build and push the three images from any branch without a local Docker daemon:
#   gcloud builds submit --config=cloudbuild-images.yaml --substitutions=_TAG=$(git rev-parse --short HEAD)
substitutions:
  _REPO: europe-west4-docker.pkg.dev/invoice-mlops/invoice-mlops
  _TAG: manual

steps:
  - name: gcr.io/cloud-builders/docker
    id: train
    args: [build, -f, Dockerfile.train, -t, "${_REPO}/train:${_TAG}", -t, "${_REPO}/train:latest", .]
  - name: gcr.io/cloud-builders/docker
    id: monitor
    waitFor: ["-"]
    args: [build, -f, Dockerfile.monitor, -t, "${_REPO}/monitor:${_TAG}", -t, "${_REPO}/monitor:latest", .]
  - name: gcr.io/cloud-builders/docker
    id: api
    waitFor: ["-"]
    args: [build, -t, "${_REPO}/api:${_TAG}", .]

images:
  - ${_REPO}/train:${_TAG}
  - ${_REPO}/train:latest
  - ${_REPO}/monitor:${_TAG}
  - ${_REPO}/monitor:latest
  - ${_REPO}/api:${_TAG}
options:
  logging: CLOUD_LOGGING_ONLY
